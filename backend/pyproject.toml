[project]
name = "aeo-backend"
version = "0.1.0"
description = "AEO (Answer Engine Optimization) tool - API backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "anthropic>=0.70",
    "playwright==1.55.0",  # last version supporting Ubuntu 20.04 (WSL); see README
]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21"]

[tool.pytest.ini_options]
testpaths = ["tests"]
